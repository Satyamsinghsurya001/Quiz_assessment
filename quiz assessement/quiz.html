<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Page</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Take a Quiz</h1>
  </header>
  <main>
    <form action="/submit_quiz" method="POST">
      <div class="question">
        <p>1. What is the capital of France?</p>
        <label><input type="radio" name="q1" value="Paris"> Paris</label>
        <label><input type="radio" name="q1" value="London"> London</label>
        <label><input type="radio" name="q1" value="Berlin"> Berlin</label>
      </div>
      <div class="question">
        <p>2. What is 2 + 2?</p>
        <label><input type="radio" name="q2" value="3"> 3</label>
        <label><input type="radio" name="q2" value="4"> 4</label>
        <label><input type="radio" name="q2" value="5"> 5</label>
      </div>
      <button type="submit">Submit Quiz</button>
    </form>
  </main>
  <footer>
    <p>© 2025 Quiz & Assignment Generator</p>
  </footer>
</body>
</html>
